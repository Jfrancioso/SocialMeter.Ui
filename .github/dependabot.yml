# Weekly pull requests for npm packages and GitHub Actions versions. CI builds each one.
# A release must be 14 days old before Dependabot proposes it (our two-week rule); security updates ignore the wait.
version: 2
updates:
  - package-ecosystem: npm
    directory: /socialmeter-ui
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    cooldown:
      default-days: 14
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
