# Continuous deployment: a push to main builds the Vue app against the production API and publishes it to Azure Static
# Web Apps. Until the AZURE_SWA_CONFIGURED repository variable is "true" (set by infra/azure-provision.ps1 in the API
# repo) this workflow does nothing, so CI alone is safe to merge.
name: Deploy UI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ui
  cancel-in-progress: false

# The workflow token can only read the repository; Azure is reached with its own secret, not this token.
permissions:
  contents: read

jobs:
  deploy:
    if: vars.AZURE_SWA_CONFIGURED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: socialmeter-ui/package-lock.json

      - name: Install and build
        working-directory: socialmeter-ui
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: socialmeter-ui/dist
          skip_app_build: true
          config_file_location: socialmeter-ui
