# Continuous integration for the front end: every push and pull request installs and builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: socialmeter-ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: socialmeter-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
