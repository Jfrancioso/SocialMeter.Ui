# Continuous integration for the front end: every push and pull request installs, audits and builds.
# A High or Critical vulnerability in a package that ships to visitors fails the run; build tools fail it only at Critical.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow token can only read the repository; nothing here writes back to GitHub.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: socialmeter-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: socialmeter-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit packages
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical

      - name: Build
        run: npm run build
