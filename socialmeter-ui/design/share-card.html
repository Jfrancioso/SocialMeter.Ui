<!doctype html>
<!--
  The link-preview card (iMessage, WhatsApp, Slack, Discord, X, Bluesky, Facebook): public/og-image.png, 1200 × 630.
  Re-render after editing (Windows, from socialmeter-ui):
    msedge --headless --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=5000
           --screenshot=public/og-image.png design/share-card.html
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=block" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0b10;
    --text: #f3f5f9;
    --text-2: #b9c0cf;
    --text-3: #7f8799;
    --accent: #ffb000;
    --cold: #5b8cff;
    --lukewarm: #6fd0c5;
    --warm: #ffb000;
    --hot: #ff6a3d;
    --electric: #ff3d8f;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(900px 520px at 8% -10%, rgba(255, 176, 0, 0.20), transparent 60%),
      radial-gradient(700px 480px at 105% 115%, rgba(255, 61, 143, 0.18), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    padding: 72px 80px 64px;
    display: flex;
    flex-direction: column;
  }
  .brand { display: flex; align-items: center; gap: 26px; }
  .bolt { width: 118px; height: 118px; filter: drop-shadow(0 0 28px rgba(255, 176, 0, 0.55)); }
  .word { font-size: 124px; font-weight: 900; letter-spacing: -0.045em; line-height: 1; }
  .word em {
    font-style: normal;
    background: linear-gradient(90deg, var(--accent), var(--electric));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tag {
    margin-top: 40px;
    font-size: 46px; font-weight: 700; line-height: 1.18; letter-spacing: -0.02em;
    color: var(--text); max-width: 980px;
  }
  .tag span { color: var(--text-2); font-weight: 500; }
  .meter { margin-top: auto; }
  .bar {
    height: 20px; border-radius: 999px;
    background: linear-gradient(90deg, var(--cold), var(--lukewarm) 25%, var(--warm) 50%, var(--hot) 75%, var(--electric));
    box-shadow: 0 0 34px rgba(255, 106, 61, 0.35);
  }
  .labels {
    margin-top: 16px; display: flex; justify-content: space-between;
    font-size: 24px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .labels span:nth-child(1) { color: var(--cold); }
  .labels span:nth-child(2) { color: var(--lukewarm); }
  .labels span:nth-child(3) { color: var(--warm); }
  .labels span:nth-child(4) { color: var(--hot); }
  .labels span:nth-child(5) { color: var(--electric); }
</style>
</head>
<body>
  <div class="brand">
    <svg class="bolt" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffb000" />
          <stop offset="1" stop-color="#ff3d8f" />
        </linearGradient>
      </defs>
      <path d="M36 6 L16 36 h14 l-4 22 L50 26 H36 Z" fill="url(#g)" />
    </svg>
    <div class="word">Chatter<em>bub</em></div>
  </div>
  <p class="tag">What people are actually saying about movies, shows and games. <span>Scored 0 to 100 from real posts.</span></p>
  <div class="meter">
    <div class="bar"></div>
    <div class="labels"><span>Cold</span><span>Lukewarm</span><span>Warm</span><span>Hot</span><span>Electric</span></div>
  </div>
</body>
</html>
