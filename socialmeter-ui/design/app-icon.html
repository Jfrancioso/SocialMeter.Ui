<!doctype html>
<!--
  The home-screen and link-card icon: public/apple-touch-icon.png, 180 × 180. Full-bleed square: iOS rounds the corners.
  Re-render after editing (Windows, from socialmeter-ui):
    msedge --headless --hide-scrollbars --force-device-scale-factor=1 --window-size=180,180
           --screenshot=public/apple-touch-icon.png design/app-icon.html
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; }
  html, body { width: 180px; height: 180px; overflow: hidden; }
  body {
    background: radial-gradient(120px 120px at 30% 20%, rgba(255, 176, 0, 0.22), transparent 70%), #0a0b10;
    display: grid; place-items: center;
  }
  svg { width: 128px; height: 128px; filter: drop-shadow(0 0 14px rgba(255, 176, 0, 0.5)); }
</style>
</head>
<body>
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffb000" />
        <stop offset="1" stop-color="#ff3d8f" />
      </linearGradient>
    </defs>
    <path d="M36 6 L16 36 h14 l-4 22 L50 26 H36 Z" fill="url(#g)" />
  </svg>
</body>
</html>
